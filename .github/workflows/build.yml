# =====================================================================
#  Little Big Planet (PSP) para Android  -  emulacion con PPSSPP
#  Todo en un solo archivo: este build.yml clona PPSSPP, le agrega
#  menu principal, controles tactiles propios (editables), selector de
#  resolucion y verificacion SHA-256 del ISO, y compila el APK.
#
#  Uso: guardalo como .github/workflows/build.yml en tu repo, (opcional)
#  sube un icon.png a la raiz y ejecuta "Run workflow". El APK sale en
#  Artifacts. ISO: /storage/emulated/0/LittleBigPlanet (el nombre da igual).
# PPSSPP es GPLv2+: si distribuyes el APK, distribuye tambien este codigo.
# =====================================================================
name: Little Big Planet PSP (PPSSPP)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  PPSSPP_REF: v1.19.3
  ABI: arm64-v8a
  APP_ID: com.elpollopaco.lbpport
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Clonar PPSSPP
        run: |
          clone() { rm -rf ppsspp; git clone "$@" https://github.com/hrydgard/ppsspp.git ppsspp; }
          clone --depth 1 --branch "$PPSSPP_REF" --recurse-submodules --shallow-submodules \
            || clone --branch "$PPSSPP_REF" --recurse-submodules \
            || clone --depth 1 --recurse-submodules --shallow-submodules

      - name: Localizar fuentes Java de PPSSPP
        run: |
          NA=$(find ppsspp/android -name NativeActivity.java | head -1)
          [ -n "$NA" ] || { echo "No encuentro NativeActivity.java"; exit 1; }
          JROOT="${NA%/org/ppsspp/ppsspp/NativeActivity.java}"
          echo "LBP_DIR=$JROOT/com/elpollopaco/lbp" >> "$GITHUB_ENV"
          echo "[LBP-CHECK] raiz Java: $JROOT"
          grep -rn "org.ppsspp.ppsspp.Shortcuts" ppsspp/android/src | head -3 || true
          grep -n "native.*\(keyDown\|keyUp\|joystickAxis\)" "$JROOT/org/ppsspp/ppsspp/NativeApp.java" || true
          grep -n "PpssppActivity" ppsspp/android/AndroidManifest.xml | head -3 || true

      - name: Agregar menu, controles tactiles y verificacion SHA-256
        run: |
          mkdir -p "$LBP_DIR"
          cat > "$LBP_DIR/Cfg.java" <<'JAVA_EOF'
          package com.elpollopaco.lbp;

          import android.content.Context;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          /** Configuración fija (hardcodeada) y utilidades de almacenamiento. */
          final class Cfg {
              /** SHA-256 del ISO de Little Big Planet (PSP). Si no coincide, no se puede jugar. */
              static final String EXPECTED_SHA256 = "19ca286f3c5991a3d47e120588ac4ba22d789a59ba30b9c303e7af8714541b28";
              /** Carpeta donde se busca el ISO (también se busca en la carpeta propia de la app). */
              static final String GAME_FOLDER = "/storage/emulated/0/LittleBigPlanet";

              static final String SHORTCUT_KEY = "org.ppsspp.ppsspp.Shortcuts";
              static final String EXTRA_PATH = "lbp_iso_path";
              static final String GAME_ACTIVITY = "org.ppsspp.ppsspp.PpssppActivity";

              static final String[] RES_LABELS = {"Auto", "1x (480x272)", "2x (960x544)", "3x (1440x816)", "4x (1920x1088)", "5x (2400x1360)"};
              static final int[] RES_VALUES = {0, 1, 2, 3, 4, 5};
              static final int DEFAULT_RES = 2;

              static File store(Context c, String name) { return new File(c.getFilesDir(), name); }

              static byte[] readAll(File f) {
                  try (InputStream in = new FileInputStream(f)) {
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] b = new byte[8192];
                      int n;
                      while ((n = in.read(b)) > 0) out.write(b, 0, n);
                      return out.toByteArray();
                  } catch (Exception e) {
                      return null;
                  }
              }

              static JSONObject readJson(File f) {
                  try {
                      byte[] b = readAll(f);
                      if (b != null) return new JSONObject(new String(b, "UTF-8"));
                  } catch (Exception e) { /* ignorar */ }
                  return new JSONObject();
              }

              static void writeJson(File f, JSONObject o) {
                  try (FileOutputStream os = new FileOutputStream(f)) {
                      os.write(o.toString().getBytes("UTF-8"));
                  } catch (Exception e) { /* ignorar */ }
              }

              static int resIndex(Context c) {
                  int i = readJson(store(c, "lbp_settings.json")).optInt("res", DEFAULT_RES);
                  return (i < 0 || i >= RES_VALUES.length) ? DEFAULT_RES : i;
              }

              static void setResIndex(Context c, int i) {
                  try {
                      File f = store(c, "lbp_settings.json");
                      JSONObject o = readJson(f);
                      o.put("res", i);
                      writeJson(f, o);
                  } catch (Exception e) { /* ignorar */ }
              }
          }
          JAVA_EOF
          cat > "$LBP_DIR/IsoFinder.java" <<'JAVA_EOF'
          package com.elpollopaco.lbp;

          import android.content.Context;
          import org.json.JSONObject;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.RandomAccessFile;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;

          /** Busca ISOs en la carpeta y verifica el SHA-256 (el nombre no importa). */
          final class IsoFinder {
              interface Progress { void onProgress(String name, int percent); }

              static final class Result {
                  File file;
                  int scanned;
              }

              private static File cacheFile(Context c) { return Cfg.store(c, "lbp_hashcache.json"); }

              static List<File> candidates(Context c) {
                  List<File> out = new ArrayList<>();
                  scan(new File(Cfg.GAME_FOLDER), 0, out);
                  File ext = c.getExternalFilesDir(null);
                  if (ext != null) scan(new File(ext, "LittleBigPlanet"), 0, out);
                  return out;
              }

              private static void scan(File dir, int depth, List<File> out) {
                  File[] l = dir.listFiles();
                  if (l == null) return;
                  Arrays.sort(l);
                  for (File f : l) {
                      if (f.isDirectory()) {
                          if (depth < 2) scan(f, depth + 1, out);
                      } else if (f.getName().toLowerCase(Locale.ROOT).endsWith(".iso")) {
                          out.add(f);
                      }
                  }
              }

              /** Un ISO9660 tiene "CD001" en el offset 0x8001. */
              static boolean looksLikeIso(File f) {
                  try (RandomAccessFile r = new RandomAccessFile(f, "r")) {
                      if (r.length() < 0x8800) return false;
                      r.seek(0x8001);
                      byte[] b = new byte[5];
                      r.readFully(b);
                      return new String(b, "US-ASCII").equals("CD001");
                  } catch (Exception e) {
                      return false;
                  }
              }

              static String sha256(File f, Progress p) {
                  try (FileInputStream in = new FileInputStream(f)) {
                      MessageDigest md = MessageDigest.getInstance("SHA-256");
                      byte[] buf = new byte[1 << 20];
                      long total = f.length(), done = 0;
                      int n, last = -1;
                      while ((n = in.read(buf)) > 0) {
                          md.update(buf, 0, n);
                          done += n;
                          if (p != null && total > 0) {
                              int pc = (int) (done * 100 / total);
                              if (pc != last) { last = pc; p.onProgress(f.getName(), pc); }
                          }
                      }
                      StringBuilder sb = new StringBuilder();
                      for (byte x : md.digest()) sb.append(String.format(Locale.ROOT, "%02x", x));
                      return sb.toString();
                  } catch (Exception e) {
                      return null;
                  }
              }

              static Result find(Context c, Progress p) {
                  Result res = new Result();
                  JSONObject cache = Cfg.readJson(cacheFile(c));
                  boolean dirty = false;
                  for (File f : candidates(c)) {
                      if (!looksLikeIso(f)) continue;
                      res.scanned++;
                      String key = f.getAbsolutePath();
                      JSONObject e = cache.optJSONObject(key);
                      String sha = null;
                      if (e != null && e.optLong("size") == f.length() && e.optLong("mtime") == f.lastModified()) {
                          sha = e.optString("sha", null);
                      }
                      if (sha == null) {
                          sha = sha256(f, p);
                          if (sha == null) continue;
                          try {
                              JSONObject n = new JSONObject();
                              n.put("size", f.length());
                              n.put("mtime", f.lastModified());
                              n.put("sha", sha);
                              cache.put(key, n);
                              dirty = true;
                          } catch (Exception ex) { /* ignorar */ }
                      }
                      if (sha.equalsIgnoreCase(Cfg.EXPECTED_SHA256)) { res.file = f; break; }
                  }
                  if (dirty) Cfg.writeJson(cacheFile(c), cache);
                  return res;
              }

              /** Comprobación rápida (usa la caché de hashes) para el proceso del juego. */
              static boolean isVerified(Context c, String path) {
                  if (path == null) return false;
                  File f = new File(path);
                  JSONObject e = Cfg.readJson(cacheFile(c)).optJSONObject(path);
                  return e != null && f.isFile()
                          && e.optLong("size") == f.length()
                          && e.optLong("mtime") == f.lastModified()
                          && Cfg.EXPECTED_SHA256.equalsIgnoreCase(e.optString("sha"));
              }
          }
          JAVA_EOF
          cat > "$LBP_DIR/GameConfig.java" <<'JAVA_EOF'
          package com.elpollopaco.lbp;

          import android.content.Context;
          import android.os.Environment;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.List;

          /** Escribe los ajustes de PPSSPP (resolución interna y ocultar sus controles táctiles). */
          final class GameConfig {
              private static final String[] HIDE = {
                  "ShowTouchControls", "ShowTouchCross", "ShowTouchCircle", "ShowTouchSquare", "ShowTouchTriangle",
                  "ShowTouchStart", "ShowTouchSelect", "ShowTouchPause", "ShowTouchLTrigger", "ShowTouchRTrigger",
                  "ShowTouchAnalogStick", "ShowTouchRightAnalogStick", "ShowTouchDpad", "ShowTouchUnthrottle", "ShowTouchRapid"
              };

              static void apply(Context c) {
                  List<String[]> kv = new ArrayList<>();
                  kv.add(new String[]{"Graphics", "InternalResolution", String.valueOf(Cfg.RES_VALUES[Cfg.resIndex(c)])});
                  for (String k : HIDE) kv.add(new String[]{"Control", k, "False"});

                  List<File> targets = new ArrayList<>();
                  targets.add(new File(Environment.getExternalStorageDirectory(), "PSP/SYSTEM/ppsspp.ini"));
                  File ext = c.getExternalFilesDir(null);
                  if (ext != null) targets.add(new File(ext, "PSP/SYSTEM/ppsspp.ini"));
                  for (File f : targets) {
                      try { merge(f, kv); } catch (Exception e) { /* ignorar */ }
                  }
              }

              private static void merge(File f, List<String[]> kv) throws Exception {
                  List<String> lines = new ArrayList<>();
                  byte[] b = Cfg.readAll(f);
                  if (b != null) {
                      for (String s : new String(b, "UTF-8").split("\r?\n", -1)) lines.add(s);
                  } else {
                      File p = f.getParentFile();
                      if (p != null) p.mkdirs();
                  }
                  while (!lines.isEmpty() && lines.get(lines.size() - 1).trim().isEmpty()) lines.remove(lines.size() - 1);
                  for (String[] e : kv) set(lines, e[0], e[1], e[2]);
                  StringBuilder sb = new StringBuilder();
                  for (String s : lines) sb.append(s).append('\n');
                  try (FileOutputStream os = new FileOutputStream(f)) {
                      os.write(sb.toString().getBytes("UTF-8"));
                  }
              }

              private static void set(List<String> lines, String sec, String key, String val) {
                  String hdr = "[" + sec + "]";
                  int start = -1;
                  for (int i = 0; i < lines.size(); i++) {
                      if (lines.get(i).trim().equals(hdr)) { start = i; break; }
                  }
                  if (start < 0) {
                      if (!lines.isEmpty()) lines.add("");
                      lines.add(hdr);
                      lines.add(key + " = " + val);
                      return;
                  }
                  int end = lines.size();
                  for (int i = start + 1; i < lines.size(); i++) {
                      if (lines.get(i).trim().startsWith("[")) { end = i; break; }
                  }
                  for (int i = start + 1; i < end; i++) {
                      String t = lines.get(i).trim();
                      int eq = t.indexOf('=');
                      if (eq > 0 && t.substring(0, eq).trim().equals(key)) { lines.set(i, key + " = " + val); return; }
                  }
                  lines.add(start + 1, key + " = " + val);
              }
          }
          JAVA_EOF
          cat > "$LBP_DIR/PadLayout.java" <<'JAVA_EOF'
          package com.elpollopaco.lbp;

          import android.content.Context;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** Disposición de los controles táctiles (posición, tamaño, escala global y opacidad). */
          final class PadLayout {
              static final int STICK = 0, DPAD = 1, TRI = 2, CIR = 3, SQU = 4, CRO = 5, LB = 6, RB = 7, START = 8, SELECT = 9, MENU = 10, N = 11;

              static final String[] IDS = {"stick", "dpad", "triangle", "circle", "square", "cross", "l", "r", "start", "select", "menu"};
              static final String[] NAMES = {"Stick analógico", "Cruceta", "Triángulo", "Círculo", "Cuadrado", "Cruz (X)", "L", "R", "Start", "Select", "Menú"};
              /** Códigos de tecla Android que PPSSPP asigna por defecto a un mando. */
              static final int[] KEYS = {0, 0, 100, 97, 99, 96, 102, 103, 108, 109, -1};

              private static final float[][] DEF = {
                  {0.13f, 0.74f, 1.0f},  // stick
                  {0.12f, 0.34f, 0.9f},  // cruceta
                  {0.87f, 0.42f, 1.0f},  // triángulo
                  {0.95f, 0.60f, 1.0f},  // círculo
                  {0.79f, 0.60f, 1.0f},  // cuadrado
                  {0.87f, 0.78f, 1.0f},  // cruz
                  {0.07f, 0.07f, 1.0f},  // L
                  {0.93f, 0.07f, 1.0f},  // R
                  {0.62f, 0.92f, 1.0f},  // start
                  {0.38f, 0.92f, 1.0f},  // select
                  {0.50f, 0.07f, 1.0f}   // menú
              };

              final float[] x = new float[N], y = new float[N], s = new float[N];
              float scale = 1f, opacity = 0.55f;

              PadLayout() { reset(); }

              void reset() {
                  for (int i = 0; i < N; i++) { x[i] = DEF[i][0]; y[i] = DEF[i][1]; s[i] = DEF[i][2]; }
                  scale = 1f;
                  opacity = 0.55f;
              }

              void copyFrom(PadLayout o) {
                  System.arraycopy(o.x, 0, x, 0, N);
                  System.arraycopy(o.y, 0, y, 0, N);
                  System.arraycopy(o.s, 0, s, 0, N);
                  scale = o.scale;
                  opacity = o.opacity;
              }

              static PadLayout load(Context c) {
                  PadLayout p = new PadLayout();
                  JSONObject o = Cfg.readJson(Cfg.store(c, "lbp_layout.json"));
                  p.scale = (float) o.optDouble("scale", 1.0);
                  p.opacity = (float) o.optDouble("opacity", 0.55);
                  JSONObject cc = o.optJSONObject("c");
                  if (cc != null) {
                      for (int i = 0; i < N; i++) {
                          JSONArray a = cc.optJSONArray(IDS[i]);
                          if (a != null && a.length() == 3) {
                              p.x[i] = (float) a.optDouble(0, DEF[i][0]);
                              p.y[i] = (float) a.optDouble(1, DEF[i][1]);
                              p.s[i] = (float) a.optDouble(2, DEF[i][2]);
                          }
                      }
                  }
                  return p;
              }

              void save(Context c) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("scale", scale);
                      o.put("opacity", opacity);
                      JSONObject cc = new JSONObject();
                      for (int i = 0; i < N; i++) {
                          JSONArray a = new JSONArray();
                          a.put((double) x[i]);
                          a.put((double) y[i]);
                          a.put((double) s[i]);
                          cc.put(IDS[i], a);
                      }
                      o.put("c", cc);
                      Cfg.writeJson(Cfg.store(c, "lbp_layout.json"), o);
                  } catch (Exception e) { /* ignorar */ }
              }
          }
          JAVA_EOF
          cat > "$LBP_DIR/GameInput.java" <<'JAVA_EOF'
          package com.elpollopaco.lbp;

          import android.app.Activity;
          import android.os.SystemClock;
          import android.util.Log;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;

          /** Envía las pulsaciones de nuestros controles a PPSSPP (como si fuera el mando 1). */
          final class GameInput {
              static volatile boolean injecting;
              static Activity activity;

              private static final int PAD0 = 10; // DEVICE_ID_PAD_0 en PPSSPP
              private static Method mDown, mUp, mAxis;
              private static boolean inited, ok;

              private static synchronized void init() {
                  if (inited) return;
                  inited = true;
                  try {
                      Class<?> c = Class.forName("org.ppsspp.ppsspp.NativeApp");
                      for (Method m : c.getDeclaredMethods()) {
                          if (!Modifier.isStatic(m.getModifiers())) continue;
                          String n = m.getName();
                          if (n.equals("keyDown")) mDown = m;
                          else if (n.equals("keyUp")) mUp = m;
                          else if (n.equals("joystickAxis")) mAxis = m;
                      }
                      ok = mDown != null && mUp != null;
                      Log.i("LBP", "NativeApp bridge ok=" + ok + " axis=" + (mAxis != null));
                  } catch (Throwable t) {
                      Log.w("LBP", "NativeApp no disponible: " + t);
                  }
              }

              static void key(int code, boolean down) {
                  init();
                  if (ok) {
                      try {
                          Method m = down ? mDown : mUp;
                          Class<?>[] pt = m.getParameterTypes();
                          Object[] a = new Object[pt.length];
                          int ints = 0;
                          for (int i = 0; i < pt.length; i++) {
                              if (pt[i] == int.class) a[i] = (ints++ == 0) ? PAD0 : code;
                              else if (pt[i] == boolean.class) a[i] = Boolean.FALSE;
                          }
                          m.invoke(null, a);
                          return;
                      } catch (Throwable t) {
                          Log.w("LBP", "keyDown/keyUp fallo, uso KeyEvent: " + t);
                          ok = false;
                      }
                  }
                  fallbackKey(code, down);
              }

              static void axis(int axisId, float v) {
                  init();
                  if (mAxis == null) return;
                  try {
                      Class<?>[] pt = mAxis.getParameterTypes();
                      Object[] a = new Object[pt.length];
                      if (pt.length == 3 && pt[1] == int.class) {
                          a[0] = PAD0; a[1] = axisId; a[2] = v;
                      } else if (pt.length == 4 && pt[1] == int[].class) {
                          a[0] = PAD0; a[1] = new int[]{axisId}; a[2] = new float[]{v}; a[3] = 1;
                      } else {
                          return;
                      }
                      mAxis.invoke(null, a);
                  } catch (Throwable t) {
                      Log.w("LBP", "joystickAxis fallo: " + t);
                  }
              }

              private static void fallbackKey(int code, boolean down) {
                  Activity a = activity;
                  if (a == null) return;
                  long t = SystemClock.uptimeMillis();
                  KeyEvent e = new KeyEvent(t, t, down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP, code, 0, 0, -1, 0, 0, InputDevice.SOURCE_GAMEPAD);
                  injecting = true;
                  try { a.dispatchKeyEvent(e); } finally { injecting = false; }
              }
          }
          JAVA_EOF
          cat > "$LBP_DIR/TouchOverlay.java" <<'JAVA_EOF'
          package com.elpollopaco.lbp;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.util.SparseIntArray;
          import android.view.MotionEvent;
          import android.view.View;

          /** Controles táctiles propios: dibujo, multitouch, deslizar entre botones y modo edición. */
          final class TouchOverlay extends View {
              interface Host {
                  void onMenu();
                  void onSelected(int idx);
              }

              private static final int[] DIR_KEYS = {19, 20, 21, 22}; // arriba, abajo, izquierda, derecha
              private static final String[] LABELS = {"L", "R", "START", "SELECT", "MENU"};
              private static final int[] SYM = {0xFF40E0B0, 0xFFFF5A5A, 0xFFE890F0, 0xFF6FA8FF};

              final PadLayout lay;
              Host host;
              boolean inject;

              private boolean edit;
              private int sel = -1;
              private float grabDx, grabDy;
              private final SparseIntArray lock = new SparseIntArray();
              private final boolean[] btn = new boolean[PadLayout.N];
              private final boolean[] dir = new boolean[4];
              private float ex, ey;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Path path = new Path();
              private final RectF rf = new RectF();

              TouchOverlay(Context c, PadLayout l) {
                  super(c);
                  lay = l;
              }

              // ---------- geometría ----------
              private float unit() { return Math.min(getWidth(), getHeight()) * 0.085f * lay.scale; }
              private boolean isRect(int i) { return i >= PadLayout.LB; }
              private float rad(int i) { return unit() * (i <= PadLayout.DPAD ? 1.9f : 0.95f) * lay.s[i]; }
              private float hw(int i) { return unit() * ((i == PadLayout.LB || i == PadLayout.RB) ? 1.5f : (i == PadLayout.MENU ? 0.8f : 1.2f)) * lay.s[i]; }
              private float hh(int i) { return unit() * ((i == PadLayout.LB || i == PadLayout.RB) ? 0.7f : (i == PadLayout.MENU ? 0.6f : 0.5f)) * lay.s[i]; }
              private float px(int i) { return lay.x[i] * getWidth(); }
              private float py(int i) { return lay.y[i] * getHeight(); }

              private float normDist(int i, float x, float y) {
                  float dx = x - px(i), dy = y - py(i);
                  if (isRect(i)) return Math.max(Math.abs(dx) / hw(i), Math.abs(dy) / hh(i));
                  return (float) Math.hypot(dx, dy) / rad(i);
              }

              private int hit(float x, float y, boolean buttonsOnly, float margin) {
                  int best = -1;
                  float bd = 1e9f;
                  for (int i = buttonsOnly ? PadLayout.TRI : 0; i < PadLayout.N; i++) {
                      float d = normDist(i, x, y);
                      if (d <= margin && d < bd) { bd = d; best = i; }
                  }
                  return best;
              }

              private boolean taken(int ctl) {
                  for (int k = 0; k < lock.size(); k++) if (lock.valueAt(k) == ctl) return true;
                  return false;
              }

              private static float clamp(float v, float a, float b) { return Math.max(a, Math.min(b, v)); }

              // ---------- API de edición ----------
              void setEdit(boolean v) {
                  if (v) clearInputs();
                  edit = v;
                  sel = -1;
                  if (host != null) host.onSelected(-1);
                  invalidate();
              }

              void adjustSelected(float f) {
                  if (sel >= 0) { lay.s[sel] = clamp(lay.s[sel] * f, 0.5f, 2.5f); invalidate(); }
              }

              void adjustScale(float f) { lay.scale = clamp(lay.scale * f, 0.6f, 1.8f); invalidate(); }

              void adjustOpacity(float d) { lay.opacity = clamp(lay.opacity + d, 0.15f, 1f); invalidate(); }

              void resetLayout() { lay.reset(); invalidate(); }

              void clearInputs() {
                  lock.clear();
                  emit(new boolean[PadLayout.N], new boolean[4], 0f, 0f);
              }

              // ---------- entrada ----------
              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (edit) return editTouch(e);
                  int a = e.getActionMasked(), ai = e.getActionIndex();
                  if (a == MotionEvent.ACTION_DOWN || a == MotionEvent.ACTION_POINTER_DOWN) {
                      int h = hit(e.getX(ai), e.getY(ai), false, 1.25f);
                      if ((h == PadLayout.STICK || h == PadLayout.DPAD) && !taken(h)) lock.put(e.getPointerId(ai), h);
                  }
                  boolean up = a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_POINTER_UP;
                  update(e, up ? ai : -1, a == MotionEvent.ACTION_CANCEL);
                  return true;
              }

              private void update(MotionEvent e, int skip, boolean cancel) {
                  boolean[] nb = new boolean[PadLayout.N];
                  boolean[] nd = new boolean[4];
                  float nx = 0f, ny = 0f;
                  if (skip >= 0) lock.delete(e.getPointerId(skip));
                  if (cancel) {
                      lock.clear();
                  } else {
                      for (int k = 0; k < e.getPointerCount(); k++) {
                          if (k == skip) continue;
                          int id = e.getPointerId(k);
                          float x = e.getX(k), y = e.getY(k);
                          int lk = lock.get(id, -1);
                          if (lk == PadLayout.STICK) {
                              float r = rad(lk), dx = x - px(lk), dy = y - py(lk);
                              float d = (float) Math.hypot(dx, dy);
                              if (d > r) { dx *= r / d; dy *= r / d; }
                              nx = dx / r;
                              ny = dy / r;
                              if (Math.hypot(nx, ny) < 0.1) { nx = 0f; ny = 0f; }
                          } else if (lk == PadLayout.DPAD) {
                              float r = rad(lk), dx = x - px(lk), dy = y - py(lk);
                              float d = (float) Math.hypot(dx, dy);
                              if (d > r * 0.2f) {
                                  float t = d * 0.38f;
                                  nd[0] = dy < -t;
                                  nd[1] = dy > t;
                                  nd[2] = dx < -t;
                                  nd[3] = dx > t;
                              }
                          } else {
                              int h = hit(x, y, true, 1.0f); // deslizar: suelta el anterior y pulsa el nuevo
                              if (h >= 0) nb[h] = true;
                          }
                      }
                  }
                  emit(nb, nd, nx, ny);
              }

              private void emit(boolean[] nb, boolean[] nd, float nx, float ny) {
                  for (int i = PadLayout.TRI; i < PadLayout.N; i++) {
                      if (nb[i] == btn[i]) continue;
                      btn[i] = nb[i];
                      if (i == PadLayout.MENU) {
                          if (nb[i] && host != null) host.onMenu();
                      } else if (inject) {
                          GameInput.key(PadLayout.KEYS[i], nb[i]);
                      }
                  }
                  for (int i = 0; i < 4; i++) {
                      if (nd[i] == dir[i]) continue;
                      dir[i] = nd[i];
                      if (inject) GameInput.key(DIR_KEYS[i], nd[i]);
                  }
                  if (inject) {
                      if (nx != ex) GameInput.axis(0, nx);
                      if (ny != ey) GameInput.axis(1, ny);
                  }
                  ex = nx;
                  ey = ny;
                  invalidate();
              }

              private boolean editTouch(MotionEvent e) {
                  float x = e.getX(), y = e.getY();
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          sel = hit(x, y, false, 1.3f);
                          if (sel >= 0) { grabDx = px(sel) - x; grabDy = py(sel) - y; }
                          if (host != null) host.onSelected(sel);
                          break;
                      case MotionEvent.ACTION_MOVE:
                          if (sel >= 0 && getWidth() > 0 && getHeight() > 0) {
                              lay.x[sel] = clamp((x + grabDx) / getWidth(), 0.03f, 0.97f);
                              lay.y[sel] = clamp((y + grabDy) / getHeight(), 0.04f, 0.96f);
                          }
                          break;
                      default:
                          break;
                  }
                  invalidate();
                  return true;
              }

              // ---------- dibujo ----------
              private static int col(int rgb, int a) { return (Math.max(0, Math.min(255, a)) << 24) | (rgb & 0xFFFFFF); }

              @Override
              protected void onDraw(Canvas c) {
                  if (edit) c.drawColor(0x55000000);
                  int a = (int) (lay.opacity * 255);
                  for (int i = 0; i < PadLayout.N; i++) draw(c, i, a);
              }

              private void draw(Canvas c, int i, int a) {
                  float x = px(i), y = py(i);
                  boolean on = i >= PadLayout.TRI && btn[i];
                  p.setStyle(Paint.Style.FILL);
                  if (i == PadLayout.STICK) {
                      float r = rad(i);
                      p.setColor(col(0xFFFFFF, a / 4));
                      c.drawCircle(x, y, r, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(r * 0.05f);
                      p.setColor(col(0xFFFFFF, a));
                      c.drawCircle(x, y, r, p);
                      float kr = r * 0.42f, off = r - kr;
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col(0xFFFFFF, a * 3 / 4));
                      c.drawCircle(x + ex * off, y + ey * off, kr, p);
                  } else if (i == PadLayout.DPAD) {
                      float r = rad(i), t = r * 0.34f;
                      p.setColor(col(0xFFFFFF, a / 3));
                      rf.set(x - r, y - t, x + r, y + t);
                      c.drawRoundRect(rf, t * 0.6f, t * 0.6f, p);
                      rf.set(x - t, y - r, x + t, y + r);
                      c.drawRoundRect(rf, t * 0.6f, t * 0.6f, p);
                      float[][] dd = {{0, -1}, {0, 1}, {-1, 0}, {1, 0}};
                      for (int k = 0; k < 4; k++) {
                          float ax = x + dd[k][0] * r * 0.68f, ay = y + dd[k][1] * r * 0.68f, s = t * 0.5f;
                          path.reset();
                          if (k < 2) {
                              path.moveTo(ax, ay + dd[k][1] * s);
                              path.lineTo(ax - s, ay - dd[k][1] * s);
                              path.lineTo(ax + s, ay - dd[k][1] * s);
                          } else {
                              path.moveTo(ax + dd[k][0] * s, ay);
                              path.lineTo(ax - dd[k][0] * s, ay - s);
                              path.lineTo(ax - dd[k][0] * s, ay + s);
                          }
                          path.close();
                          p.setColor(col(0xFFFFFF, dir[k] ? 255 : a));
                          c.drawPath(path, p);
                      }
                  } else if (!isRect(i)) {
                      float r = rad(i);
                      p.setColor(col(on ? 0x888888 : 0x222222, on ? a + 90 : a * 2 / 3));
                      c.drawCircle(x, y, r, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(r * 0.07f);
                      p.setColor(col(0xFFFFFF, a));
                      c.drawCircle(x, y, r, p);
                      p.setStrokeWidth(r * 0.14f);
                      p.setColor(col(SYM[i - PadLayout.TRI], Math.min(255, a + 60)));
                      float s = r * 0.48f;
                      switch (i) {
                          case PadLayout.TRI:
                              path.reset();
                              path.moveTo(x, y - s);
                              path.lineTo(x - s, y + s * 0.8f);
                              path.lineTo(x + s, y + s * 0.8f);
                              path.close();
                              c.drawPath(path, p);
                              break;
                          case PadLayout.CIR:
                              c.drawCircle(x, y, s, p);
                              break;
                          case PadLayout.SQU:
                              c.drawRect(x - s * 0.9f, y - s * 0.9f, x + s * 0.9f, y + s * 0.9f, p);
                              break;
                          default:
                              c.drawLine(x - s, y - s, x + s, y + s, p);
                              c.drawLine(x - s, y + s, x + s, y - s, p);
                              break;
                      }
                  } else {
                      float w = hw(i), h = hh(i);
                      rf.set(x - w, y - h, x + w, y + h);
                      p.setColor(col(on ? 0x888888 : 0x222222, on ? a + 90 : a * 2 / 3));
                      c.drawRoundRect(rf, h, h, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(h * 0.12f);
                      p.setColor(col(0xFFFFFF, a));
                      c.drawRoundRect(rf, h, h, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(col(0xFFFFFF, Math.min(255, a + 60)));
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTextSize(h * 1.05f);
                      c.drawText(LABELS[i - PadLayout.LB], x, y + h * 0.36f, p);
                  }
                  if (edit && i == sel) {
                      p.setStyle(Paint.Style.STROKE);
                      p.setStrokeWidth(6f);
                      p.setColor(0xFFFFD83D);
                      if (isRect(i)) {
                          rf.set(x - hw(i) - 6, y - hh(i) - 6, x + hw(i) + 6, y + hh(i) + 6);
                          c.drawRoundRect(rf, hh(i), hh(i), p);
                      } else {
                          c.drawCircle(x, y, rad(i) * 1.12f, p);
                      }
                  }
              }
          }
