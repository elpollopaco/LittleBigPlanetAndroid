          package com.elpollopaco.lbp;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.Application;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Process;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Proxy;

          /**
           * Se ejecuta también en el proceso del juego (:game). Cuando arranca la actividad de PPSSPP:
           * verifica que el ISO sea el correcto, pone encima NUESTROS controles táctiles y sustituye
           * el botón Atrás por nuestro menú de pausa.
           */
          public class LbpApp extends Application implements Application.ActivityLifecycleCallbacks {
              private static final String HINT = "Toca un control para seleccionarlo y arrástralo";

              private final Handler h = new Handler(Looper.getMainLooper());
              private TouchOverlay overlay;
              private LinearLayout panel;
              private TextView hint;
              private AlertDialog dialog;

              @Override
              public void onCreate() {
                  super.onCreate();
                  registerActivityLifecycleCallbacks(this);
              }

              private static boolean isGame(Activity a) { return a.getClass().getName().endsWith(".PpssppActivity"); }

              private static void die() { Process.killProcess(Process.myPid()); }

              @Override
              public void onActivityCreated(Activity a, Bundle b) {
                  if (!isGame(a)) return;
                  String path = a.getIntent() == null ? null : a.getIntent().getStringExtra(Cfg.EXTRA_PATH);
                  if (!IsoFinder.isVerified(a, path)) { // solo se juega con el ISO verificado por SHA-256
                      a.finish();
                      h.postDelayed(LbpApp::die, 300);
                  }
              }

              @Override
              public void onActivityResumed(Activity a) {
                  if (isGame(a) && !a.isFinishing()) attach(a);
              }

              @Override
              public void onActivityDestroyed(Activity a) {
                  if (isGame(a) && a.isFinishing()) h.postDelayed(LbpApp::die, 200); // limpia el proceso del emulador
              }

              @Override public void onActivityStarted(Activity a) { }
              @Override public void onActivityPaused(Activity a) { }
              @Override public void onActivityStopped(Activity a) { }
              @Override public void onActivitySaveInstanceState(Activity a, Bundle b) { }

              private void attach(final Activity a) {
                  GameInput.activity = a;
                  if (overlay == null) {
                      overlay = new TouchOverlay(a, PadLayout.load(a));
                      overlay.inject = true;
                      overlay.host = new TouchOverlay.Host() {
                          @Override public void onMenu() { showMenu(a); }
                          @Override public void onSelected(int i) {
                              if (hint != null) hint.setText(i < 0 ? HINT : "Seleccionado: " + PadLayout.NAMES[i]);
                          }
                      };
                      hookBack(a);
                      h.post(new Runnable() {
                          @Override public void run() {
                              if (a.isFinishing()) return;
                              ensure(a);
                              h.postDelayed(this, 800); // por si PPSSPP reemplaza su vista
                          }
                      });
                  }
                  ensure(a);
              }

              private void ensure(Activity a) {
                  if (overlay.getParent() == null) {
                      try { a.addContentView(overlay, new ViewGroup.LayoutParams(-1, -1)); } catch (Throwable t) { /* reintenta */ }
                  }
              }

              /** Intercepta Atrás: abre nuestro menú en vez del menú de PPSSPP (que permitiría cargar otros juegos). */
              private void hookBack(final Activity a) {
                  final Window w = a.getWindow();
                  final Window.Callback orig = w.getCallback();
                  w.setCallback((Window.Callback) Proxy.newProxyInstance(
                          Window.Callback.class.getClassLoader(), new Class<?>[]{Window.Callback.class},
                          (proxy, m, args) -> {
                              if ("dispatchKeyEvent".equals(m.getName()) && args != null && args.length == 1
                                      && args[0] instanceof KeyEvent) {
                                  KeyEvent e = (KeyEvent) args[0];
                                  if (!GameInput.injecting && e.getKeyCode() == KeyEvent.KEYCODE_BACK) {
                                      if (e.getAction() == KeyEvent.ACTION_UP) h.post(() -> showMenu(a));
                                      return Boolean.TRUE;
                                  }
                              }
                              try {
                                  return m.invoke(orig, args);
                              } catch (InvocationTargetException ex) {
                                  throw ex.getCause();
                              }
                          }));
              }

              private void showMenu(final Activity a) {
                  if (a.isFinishing() || (dialog != null && dialog.isShowing())) return;
                  overlay.clearInputs();
                  dialog = new AlertDialog.Builder(a, android.R.style.Theme_Material_Dialog_Alert)
                          .setTitle("Little Big Planet")
                          .setItems(new String[]{"Continuar", "Editar controles", "Salir al menú"}, (d, which) -> {
                              if (which == 1) startEdit(a);
                              else if (which == 2) a.finish();
                          })
                          .create();
                  dialog.show();
              }

              private void startEdit(Activity a) {
                  overlay.setEdit(true);
                  hint = new TextView(a);
                  hint.setText(HINT);
                  panel = Ui.editorPanel(a, overlay, hint, () -> endEdit(a, true), () -> endEdit(a, false));
                  a.addContentView(panel, new FrameLayout.LayoutParams(-2, -2, Gravity.CENTER));
              }

              private void endEdit(Activity a, boolean save) {
                  if (save) overlay.lay.save(a);
                  else overlay.lay.copyFrom(PadLayout.load(a));
                  overlay.setEdit(false);
                  if (panel != null && panel.getParent() instanceof ViewGroup) ((ViewGroup) panel.getParent()).removeView(panel);
                  panel = null;
                  hint = null;
              }
          }
