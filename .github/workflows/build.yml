          package com.elpollopaco.lbp;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** Utilidades de interfaz (todo se construye por código, sin XML). */
          final class Ui {
              static int dp(Context c, float v) {
                  return (int) (v * c.getResources().getDisplayMetrics().density + 0.5f);
              }

              static void immersive(Activity a) {
                  a.getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              static Button btn(Context c, String text, final Runnable action) {
                  Button b = new Button(c);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextSize(14);
                  b.setTextColor(0xFFFFFFFF);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  b.setPadding(dp(c, 14), dp(c, 6), dp(c, 14), dp(c, 6));
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(0xFF3A4260);
                  g.setCornerRadius(dp(c, 10));
                  b.setBackground(g);
                  b.setOnClickListener(v -> action.run());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                  lp.setMargins(dp(c, 3), dp(c, 3), dp(c, 3), dp(c, 3));
                  b.setLayoutParams(lp);
                  return b;
              }

              private static LinearLayout row(Context c, String label, Runnable minus, Runnable plus) {
                  LinearLayout r = new LinearLayout(c);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  TextView t = new TextView(c);
                  t.setText(label);
                  t.setTextColor(0xFFDDDDDD);
                  t.setTextSize(13);
                  t.setLayoutParams(new LinearLayout.LayoutParams(dp(c, 150), -2));
                  r.addView(t);
                  r.addView(btn(c, "-", minus));
                  r.addView(btn(c, "+", plus));
                  return r;
              }

              /** Panel de edición: tamaño del control, escala global, opacidad, restablecer, cancelar y guardar. */
              static LinearLayout editorPanel(Context c, final TouchOverlay ov, TextView hint, Runnable onSave, Runnable onCancel) {
                  LinearLayout col = new LinearLayout(c);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(c, 14), dp(c, 10), dp(c, 14), dp(c, 12));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xE0161B28);
                  bg.setCornerRadius(dp(c, 16));
                  bg.setStroke(dp(c, 1), 0x55FFFFFF);
                  col.setBackground(bg);

                  hint.setTextColor(0xFFFFFFFF);
                  hint.setTextSize(13);
                  hint.setGravity(Gravity.CENTER);
                  hint.setPadding(0, 0, 0, dp(c, 6));
                  col.addView(hint, new LinearLayout.LayoutParams(-2, -2));

                  col.addView(row(c, "Tamaño del control", () -> ov.adjustSelected(0.9f), () -> ov.adjustSelected(1.1f)));
                  col.addView(row(c, "Escala global", () -> ov.adjustScale(0.95f), () -> ov.adjustScale(1.05f)));
                  col.addView(row(c, "Opacidad", () -> ov.adjustOpacity(-0.05f), () -> ov.adjustOpacity(0.05f)));

                  LinearLayout last = new LinearLayout(c);
                  last.setGravity(Gravity.CENTER);
                  last.addView(btn(c, "Restablecer", ov::resetLayout));
                  last.addView(btn(c, "Cancelar", onCancel));
                  last.addView(btn(c, "Guardar", onSave));
                  col.addView(last);
                  return col;
              }
          }
