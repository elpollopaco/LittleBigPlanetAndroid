                  col.addView(again);
                  col.addView(text("Port creado por elpollopaco", 11, 0x88FFFFFF, false));

                  sv.addView(col, new android.widget.FrameLayout.LayoutParams(-1, -2));
                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refreshRes();
                  scan();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) Ui.immersive(this);
              }

              private void refreshRes() {
                  res.setText("Resolución: " + Cfg.RES_LABELS[Cfg.resIndex(this)]);
              }

              private boolean hasStorage() {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  if (Build.VERSION.SDK_INT >= 23) {
                      return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
                              && checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
                  }
                  return true;
              }

              private void askStorage() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + getPackageName())));
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }
              }

              private void setPlayEnabled(boolean on) {
                  play.setEnabled(on);
                  play.setAlpha(on ? 1f : 0.4f);
              }

              private void scan() {
                  if (scanning) return;
                  scanning = true;
                  found = null;
                  setPlayEnabled(false);
                  perm.setVisibility(hasStorage() ? View.GONE : View.VISIBLE);
                  status.setTextColor(0xFFCCCCCC);
                  status.setText("Buscando ISO en:\n" + Cfg.GAME_FOLDER);
                  new Thread(() -> {
                      final IsoFinder.Result r = IsoFinder.find(this, (n, pc) ->
                              ui.post(() -> status.setText("Verificando SHA-256: " + n + " (" + pc + "%)")));
                      ui.post(() -> done(r));
                  }).start();
              }

              private void done(IsoFinder.Result r) {
                  scanning = false;
                  found = r.file;
                  if (found != null) {
                      status.setTextColor(0xFF7CFC9A);
                      status.setText("Little Big Planet verificado\n" + found.getName());
                      setPlayEnabled(true);
                  } else if (r.scanned > 0) {
                      status.setTextColor(0xFFFF8A8A);
                      status.setText("Se encontraron " + r.scanned + " ISO, pero ninguno coincide con el SHA-256 de Little Big Planet (PSP). No se puede jugar.");
                  } else {
                      status.setTextColor(0xFFFFD27C);
                      status.setText("No se encontró ningún ISO.\nColoca el ISO de Little Big Planet (PSP) en:\n"
                              + Cfg.GAME_FOLDER + "\n(el nombre no importa, solo el SHA-256)"
                              + (hasStorage() ? "" : "\nFalta el permiso de acceso a archivos."));
                  }
              }

              private void play() {
                  if (found == null) return;
                  GameConfig.apply(this);
                  Intent i = new Intent();
                  i.setClassName(getPackageName(), Cfg.GAME_ACTIVITY);
                  i.putExtra(Cfg.SHORTCUT_KEY, found.getAbsolutePath());
                  i.putExtra(Cfg.EXTRA_PATH, found.getAbsolutePath());
                  try {
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "No se pudo iniciar el emulador: " + e, Toast.LENGTH_LONG).show();
                  }
              }
          }
          JAVA_EOF

      - name: Parchear manifest, gradle e icono
        run: |
          python3 - <<'PY_EOF'
          import os
          import pathlib
          import re
          import sys

          root = pathlib.Path('ppsspp/android')
          man = root / 'AndroidManifest.xml'
          if not man.exists():
              sys.exit('[LBP] No encuentro ppsspp/android/AndroidManifest.xml')
          s = man.read_text(encoding='utf-8')
          has_icon = os.path.exists('icon.png')
          app_id = os.environ.get('APP_ID', 'com.elpollopaco.lbpport')
          abi = os.environ.get('ABI', 'arm64-v8a')

          # 1) Quitar los filtros que permiten abrir PPSSPP solo (launcher / "abrir con"): el unico acceso es nuestro menu
          def drop(m):
              b = m.group(0)
              bad = ('android.intent.action.VIEW' in b) or ('android.intent.action.MAIN' in b) or ('LAUNCHER' in b)
              return '' if bad else b
          s = re.sub(r'<intent-filter\b.*?</intent-filter>', drop, s, flags=re.S)

          # 2) PpssppActivity: proceso propio (:game) y horizontal
          def fix_act(m):
              t = m.group(0)
              t = re.sub(r'\sandroid:process="[^"]*"', '', t)
              t = re.sub(r'\sandroid:screenOrientation="[^"]*"', '', t)
              return t.replace('<activity', '<activity android:process=":game" android:screenOrientation="sensorLandscape"', 1)
          s, n = re.subn(r'<activity\b[^>]*android:name="[^"]*PpssppActivity"[^>]*>', fix_act, s, flags=re.S)
          if n == 0:
              sys.exit('[LBP] No encuentro PpssppActivity en el manifest')

          # 3) <application>: nuestra clase Application, nombre, icono y almacenamiento
          m = re.search(r'<application\b[^>]*>', s, flags=re.S)
          if not m:
              sys.exit('[LBP] No encuentro <application> en el manifest')
          t = m.group(0)
          if re.search(r'\sandroid:name="', t):
              print('[LBP] AVISO: <application> ya tenia android:name; se reemplaza por LbpApp')
          for a in ('name', 'label', 'roundIcon', 'requestLegacyExternalStorage'):
              t = re.sub(r'\sandroid:%s="[^"]*"' % a, '', t)
          add = ' android:name="com.elpollopaco.lbp.LbpApp" android:label="Little Big Planet" android:requestLegacyExternalStorage="true"'
          if has_icon:
              t = re.sub(r'\sandroid:icon="[^"]*"', '', t)
              add += ' android:icon="@drawable/lbp_icon"'
          t = t.replace('<application', '<application' + add, 1)
          s = s[:m.start()] + t + s[m.end():]

          # 4) Permisos
          perms = ''
          for p in ('MANAGE_EXTERNAL_STORAGE', 'READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE'):
              if ('android.permission.' + p) not in s:
                  perms += '    <uses-permission android:name="android.permission.%s"/>\n' % p
          s = s.replace('<application', perms + '    <application', 1)

          # 5) Nuestras actividades (menu principal = unico launcher)
          acts = '''
                  <activity android:name="com.elpollopaco.lbp.MainMenuActivity"
                      android:label="Little Big Planet"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name="com.elpollopaco.lbp.ControlEditorActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar"/>
          '''
          s = s.replace('</application>', acts + '    </application>', 1)
          man.write_text(s, encoding='utf-8')
          print('[LBP] Manifest parcheado')

          # 6) Icono propio (icon.png en la raiz del repo)
          if has_icon:
              d = root / 'res' / 'drawable-nodpi'
              d.mkdir(parents=True, exist_ok=True)
              (d / 'lbp_icon.png').write_bytes(pathlib.Path('icon.png').read_bytes())
              print('[LBP] Icono: icon.png')

          # 7) build.gradle: applicationId propio, solo una ABI, sin lint bloqueante
          bg = root / 'build.gradle'
          if bg.exists():
              g = bg.read_text(encoding='utf-8')
              g, n1 = re.subn(r'applicationId\s*=?\s*["\'][^"\']+["\']', 'applicationId "%s"' % app_id, g)
              g, n2 = re.subn(r'abiFilters[ \t]+[^\n}]*', 'abiFilters "%s"' % abi, g)
              g += '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n'
              bg.write_text(g, encoding='utf-8')
              print('[LBP] build.gradle: applicationId x%d, abiFilters x%d' % (n1, n2))
          else:
              print('[LBP] AVISO: no hay android/build.gradle')

          # 8) Por si acaso: que PPSSPP no muestre sus propios controles tactiles por defecto
          cfg = pathlib.Path('ppsspp/Core/Config.cpp')
          if cfg.exists():
              c = cfg.read_text(encoding='utf-8', errors='ignore')
              c2, n3 = re.subn(r'(ConfigSetting\("ShowTouchControls",\s*&g_Config\.bShowTouchControls,\s*)true', r'\1false', c)
              if n3:
                  cfg.write_text(c2, encoding='utf-8')
              print('[LBP] Config.cpp ShowTouchControls=false: %d' % n3)
          PY_EOF

      - name: Compilar APK
        working-directory: ppsspp/android
        env:
          GRADLE_OPTS: -Xmx3g -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleNormalOptimized \
            || ./gradlew --no-daemon --stacktrace assembleNormalRelease \
            || ./gradlew --no-daemon --stacktrace assembleNormalDebug

      - name: Restaurar keystore (misma firma entre builds)
        uses: actions/cache@v4
        with:
          path: lbp.jks
          key: lbp-keystore-v1

      - name: Alinear y firmar APK
        run: |
          APK=$(find ppsspp/android -path '*outputs/apk*' -name '*.apk' | grep -iv -e gold -e vr | head -1)
          [ -n "$APK" ] || { echo "No se genero ningun APK"; exit 1; }
          echo "[LBP-CHECK] APK: $APK"
          if [ ! -f lbp.jks ]; then
            keytool -genkeypair -keystore lbp.jks -storepass lbp12345 -keypass lbp12345 \
              -alias lbp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LBP Port"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" out/aligned.apk
          "$BT/apksigner" sign --ks lbp.jks --ks-pass pass:lbp12345 --key-pass pass:lbp12345 \
            --out out/LittleBigPlanet-PSP.apk out/aligned.apk
          rm -f out/aligned.apk out/*.idsig

      - uses: actions/upload-artifact@v4
        with:
          name: LittleBigPlanet-PSP-apk
          path: out/LittleBigPlanet-PSP.apk
