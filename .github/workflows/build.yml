          /** Editor de controles desde el menú principal. */
          public class ControlEditorActivity extends Activity {
              private static final String HINT = "Toca un control para seleccionarlo y arrástralo";
              private TouchOverlay ov;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(0xFF10141F);
                  ov = new TouchOverlay(this, PadLayout.load(this));
                  root.addView(ov, new FrameLayout.LayoutParams(-1, -1));

                  final TextView hint = new TextView(this);
